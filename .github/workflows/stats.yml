name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 0 * * *" # se regenera cada día a medianoche
  workflow_dispatch: {} # también puedes lanzarlo manualmente desde la pestaña Actions
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=danielqu7e9-hub&show_icons=true&theme=radical&hide_border=true&bg_color=0d1117&title_color=7F52FF&icon_color=7F52FF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=danielqu7e9-hub&layout=compact&theme=radical&hide_border=true&bg_color=0d1117&title_color=7F52FF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update GitHub stats cards" || exit 0
          git push
